boss_bar: false                             # Boss bar when looking at furniture
furniture_evolution_status: true            # Display hologram on interacting with Furniture with evolution mechanics
prevent_furniture_break_with_tools: true
prevent_furniture_break_with_sword: true
double_hit_destroy_mechanic: true           # Destroy furniture with double hit
count_shears_as_silktouch: [ ]              # List of STRINGBLOCKs and CHORUSBLOCKs ids
aura_mechanic_delay: 5                      # Delay of refreshing particles in ticks

default_totem_sound: minecraft:entity.totem.use # Default sound for totem (useful if you wanna use /nexoaddon totem command)
enable_totem_delay: false                   # Adds a 2 tick delay before the totem animation packet (fixes animation on some clients/versions)

update_checker: true

weaponmechanics:
  auto_migrate_durability: true              # Upgrade legacy guns as players encounter them

litefish_seafood:
  enabled: true
  foods:
    tmls_fish_sandwich:
      name: "Angler's Focus"
      duration_seconds: 300
      bonus_catch_chance: 0.0
      minigame:
        speed: -1
        size: 1
        player_health: 1
        drop_health: -1
    tmls_tuna_salad_sandwich:
      name: "Bountiful Catch"
      duration_seconds: 300
      bonus_catch_chance: 0.10
      minigame:
        speed: 0
        size: 0
        player_health: 0
        drop_health: 0
    tmls_fish_stew:
      name: "Captain's Feast"
      duration_seconds: 300
      bonus_catch_chance: 0.15
      minigame:
        speed: -1
        size: 1
        player_health: 1
        drop_health: -1

messages:
  bigmining:
    enabled: <green>Bigmining on
    disabled: <red>Bigmining off
  veinminer:
    enabled: <green>VeinMiner on
    disabled: <red>VeinMiner off
  bottledexp:
    not_enough_exp: <red>Not enough experience to convert
  autocatch:
    enabled: "<gray>AutoCatch is now <green>enabled<gray>."
    disabled: "<gray>AutoCatch is now <red>disabled<gray>."
  seafood_buff:
    activated: "<aqua>%buff% <gray>is active for <white>%duration%<gray>."
    bonus_catch: "<aqua>%buff% <gray>produced a bonus catch!"

debug: false
